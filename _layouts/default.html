<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }} | {{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="icon" href="/favicon.png">
    <link rel="stylesheet" href="/assets/style.css">
  </head>
  <body>
    <header class="site-header">
      <nav class="nav">
        <a class="brand" href="/">satyaorz</a>
        <div class="nav-links">
          <a href="/writeups/">Writeups</a>
          <a href="https://github.com/satyaorz">GitHub</a>
          <a href="https://x.com/satyaorz">X</a>
          <a href="https://www.linkedin.com/in/satyaorz">LinkedIn</a>
          <select id="theme-select" class="theme-select" aria-label="Theme selector">
            <option value="gruvbox">Theme: Gruvbox</option>
            <option value="rose-pine">Theme: Rose Pine</option>
            <option value="everforest">Theme: Everforest</option>
          </select>
        </div>
      </nav>
    </header>

    <main class="page">
      {{ content }}
    </main>

    <script>
      const themeSelect = document.getElementById("theme-select");
      const storedTheme = localStorage.getItem("theme") || "gruvbox";

      document.documentElement.dataset.theme = storedTheme;
      themeSelect.value = storedTheme;

      themeSelect.addEventListener("change", () => {
        document.documentElement.dataset.theme = themeSelect.value;
        localStorage.setItem("theme", themeSelect.value);
      });
    </script>
  </body>
</html>
